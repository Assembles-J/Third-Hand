services:
  api:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
        PIP_TRUSTED_HOST: "${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}"
    image: third-hand-api:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      THIRD_HAND_DB_PATH: /app/data/third_hand.db
      THIRD_HAND_MARKET_PROVIDER: ${THIRD_HAND_MARKET_PROVIDER:-akshare}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - ./data:/app/data
    ports:
      # Temporary direct access for debugging. Restrict this to localhost again before production.
      - "0.0.0.0:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
