services:
  api:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
        PIP_TRUSTED_HOST: "${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}"
    image: third-hand-api:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      THIRD_HAND_DB_PATH: /app/data/third_hand.db
      THIRD_HAND_MARKET_PROVIDER: ${THIRD_HAND_MARKET_PROVIDER:-akshare}
      MARKET_REFRESH_ENABLED: ${MARKET_REFRESH_ENABLED:-true}
      MARKET_REFRESH_INTERVAL_SECONDS: ${MARKET_REFRESH_INTERVAL_SECONDS:-60}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      THIRD_HAND_AI_PROVIDER: ${THIRD_HAND_AI_PROVIDER:-auto}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
      FINGPT_BASE_URL: ${FINGPT_BASE_URL:-}
      FINGPT_MODEL: ${FINGPT_MODEL:-fingpt}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
      APP_UPDATE_DIRECTORY: /app/releases
      APP_UPDATE_APK_FILE: ${APP_UPDATE_APK_FILE:-}
      APP_UPDATE_VERSION_CODE: ${APP_UPDATE_VERSION_CODE:-1}
      APP_UPDATE_VERSION_NAME: ${APP_UPDATE_VERSION_NAME:-0.1.0}
      APP_UPDATE_CHANGELOG: ${APP_UPDATE_CHANGELOG:-}
    volumes:
      - ./data:/app/data
      - ./releases:/app/releases:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      app_gateway:
        aliases:
          - third-hand-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app_gateway:
    external: true
    name: app_gateway
