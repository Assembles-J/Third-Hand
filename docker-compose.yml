services:
  api:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
        PIP_TRUSTED_HOST: "${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}"
    image: third-hand-api:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      THIRD_HAND_DB_PATH: /app/data/third_hand.db
      THIRD_HAND_MARKET_PROVIDER: ${THIRD_HAND_MARKET_PROVIDER:-auto}
      MARKET_REFRESH_ENABLED: ${MARKET_REFRESH_ENABLED:-true}
      MARKET_REFRESH_INTERVAL_SECONDS: ${MARKET_REFRESH_INTERVAL_SECONDS:-60}
      THIRD_HAND_LOG_LEVEL: ${THIRD_HAND_LOG_LEVEL:-INFO}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 决策报告链：仅研究和纸面复核；无论开关如何均不会自动下单。
      DECISION_SHADOW_MODE: ${DECISION_SHADOW_MODE:-true}
      # 使用账户资金、仓位上限、风险预算和整手规则计算数量候选。
      DECISION_SIZING_ENABLED: ${DECISION_SIZING_ENABLED:-true}
      # 调用 DeepSeek 对已有证据做个股化权衡；需要有效 DEEPSEEK_API_KEY。
      DECISION_AI_ENABLED: ${DECISION_AI_ENABLED:-true}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_REASONING_MODEL: ${DEEPSEEK_REASONING_MODEL:-deepseek-v4-pro}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-30}
      DECISION_AI_MAX_TOKENS: ${DECISION_AI_MAX_TOKENS:-1200}
      DEEPSEEK_MAX_RETRIES: ${DEEPSEEK_MAX_RETRIES:-2}
      DEEPSEEK_RETRY_BASE_SECONDS: ${DEEPSEEK_RETRY_BASE_SECONDS:-0.5}
      DEEPSEEK_MAX_CONCURRENCY: ${DEEPSEEK_MAX_CONCURRENCY:-4}
      DEEPSEEK_CONCURRENCY_WAIT_SECONDS: ${DEEPSEEK_CONCURRENCY_WAIT_SECONDS:-1}
      DEEPSEEK_CIRCUIT_FAILURE_THRESHOLD: ${DEEPSEEK_CIRCUIT_FAILURE_THRESHOLD:-3}
      DEEPSEEK_CIRCUIT_RESET_SECONDS: ${DEEPSEEK_CIRCUIT_RESET_SECONDS:-60}
      DEEPSEEK_TRUST_ENV_PROXY: ${DEEPSEEK_TRUST_ENV_PROXY:-false}
      # Research Chat remains independently gated; all capabilities default off.
      RESEARCH_CHAT_ENABLED: ${RESEARCH_CHAT_ENABLED:-true}
      RESEARCH_CHAT_SSE_ENABLED: ${RESEARCH_CHAT_SSE_ENABLED:-true}
      RESEARCH_CHAT_REASONING_VISIBLE: ${RESEARCH_CHAT_REASONING_VISIBLE:-true}
      RESEARCH_CHAT_TOOL_CALLING_ENABLED: ${RESEARCH_CHAT_TOOL_CALLING_ENABLED:-true}
      RESEARCH_CHAT_CLARIFICATION_ENABLED: ${RESEARCH_CHAT_CLARIFICATION_ENABLED:-true}
      RESEARCH_CHAT_DECISION_OUTPUT_ENABLED: ${RESEARCH_CHAT_DECISION_OUTPUT_ENABLED:-true}
      RESEARCH_CHAT_RAW_REASONING_PERSIST: ${RESEARCH_CHAT_RAW_REASONING_PERSIST:-true}
      RESEARCH_CHAT_MAX_TOOL_CALLS: ${RESEARCH_CHAT_MAX_TOOL_CALLS:-12}
      RESEARCH_CHAT_MAX_TOOL_ROUNDS: ${RESEARCH_CHAT_MAX_TOOL_ROUNDS:-4}
      AI_ANALYSIS_PROMPT_VERSION: ${AI_ANALYSIS_PROMPT_VERSION:-news-analysis-prompt-v2}
      AI_ANALYSIS_SCHEMA_VERSION: ${AI_ANALYSIS_SCHEMA_VERSION:-news-analysis-schema-v2}
      AI_ANALYSIS_SCHEMA_RETRIES: ${AI_ANALYSIS_SCHEMA_RETRIES:-1}
      AI_ANALYSIS_MAX_TOKENS: ${AI_ANALYSIS_MAX_TOKENS:-900}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
      APP_UPDATE_PUBLIC_BASE_URL: ${APP_UPDATE_PUBLIC_BASE_URL:-}
      APP_UPDATE_DIRECTORY: /app/releases
      APP_UPDATE_APK_FILE: ${APP_UPDATE_APK_FILE:-}
      APP_UPDATE_VERSION_CODE: ${APP_UPDATE_VERSION_CODE:-1}
      APP_UPDATE_VERSION_NAME: ${APP_UPDATE_VERSION_NAME:-0.1.0}
      APP_UPDATE_CHANGELOG: ${APP_UPDATE_CHANGELOG:-}
    volumes:
      - ./data:/app/data
      - ./releases:/app/releases:ro
    ports:
      # Nginx uses app_gateway; localhost binding is retained for server-side diagnostics.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      app_gateway:
        aliases:
          - third-hand-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app_gateway:
    external: true
    name: app_gateway
