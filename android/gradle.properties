android.useAndroidX=true
kotlin.code.style=official
# Android Gradle Plugin, Compose and the bundled Chinese OCR model exceed Gradle's
# default 512 MB heap during debug builds. Keep this in version control for CI.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.workers.max=2
