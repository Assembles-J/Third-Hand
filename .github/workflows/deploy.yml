name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            echo "Remote identity: $(id -un) ($(id -u))"
            ls -ld /opt
            mkdir -pv /opt/third-hand
            test -w /opt/third-hand
      - name: Upload deployment files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: backend,docker-compose.yml,.env.example
          target: /opt/third-hand
          overwrite: true
      - name: Build and start services
        uses: appleboy/ssh-action@v1.2.2
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: TUSHARE_TOKEN
          script: |
            set -e
            cd /opt/third-hand
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "Created initial .env from .env.example"
            fi
            # The secret stays out of the repository and the workflow logs.
            umask 077
            sed -i '/^TUSHARE_TOKEN=/d; /^THIRD_HAND_MARKET_PROVIDER=/d' .env
            printf '%s\n' 'THIRD_HAND_MARKET_PROVIDER=auto' >> .env
            printf 'TUSHARE_TOKEN=%s\n' "$TUSHARE_TOKEN" >> .env
            if docker compose version >/dev/null 2>&1; then
              docker compose up -d --build --remove-orphans
              docker compose ps
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose up -d --build --remove-orphans
              docker-compose ps
            else
              echo "Docker Compose is not installed on the server."
              exit 1
            fi
