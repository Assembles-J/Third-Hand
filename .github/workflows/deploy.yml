name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'android/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main
      release_android:
        description: Build and publish a new signed Android APK
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend and optional signed APK
    runs-on: ubuntu-latest
    environment: production
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.3.${{ github.run_number }}
      APK_FILE: third-hand-0.3.${{ github.run_number }}.apk
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APP_PUBLIC_BASE_URL: ${{ secrets.APP_PUBLIC_BASE_URL }}
      APP_UPDATE_PUBLIC_BASE_URL: ${{ secrets.APP_UPDATE_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Detect deployment scope
        id: release_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_ANDROID_RELEASE: ${{ inputs.release_android || false }}
        run: |
          set -eu

          backend_changed=false
          release_android=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            backend_changed=true
            release_android="$FORCE_ANDROID_RELEASE"
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git show --format= --name-only "$GITHUB_SHA")"
            if printf '%s\n' "$changed_files" | grep -Eq '^(backend/|docker-compose\.yml$|\.env\.example$|\.github/workflows/deploy\.yml$)'; then
              backend_changed=true
            fi
            if printf '%s\n' "$changed_files" | grep -q '^android/'; then
              release_android=true
            fi
          else
            if ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- backend/ docker-compose.yml .env.example .github/workflows/deploy.yml; then
              backend_changed=true
            fi
            if ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- android/; then
              release_android=true
            fi
          fi

          deploy_sha="$(git rev-parse HEAD)"
          echo "backend_changed=$backend_changed" >> "$GITHUB_OUTPUT"
          echo "release_android=$release_android" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "Backend deployment required: $backend_changed"
          echo "Android release required: $release_android"
          echo "Deploy commit: $deploy_sha"

      - name: Validate public deployment URL
        shell: bash
        run: |
          set -eu
          case "$APP_PUBLIC_BASE_URL" in
            https://*) ;;
            *) echo "APP_PUBLIC_BASE_URL must be an HTTPS URL"; exit 1 ;;
          esac
          if [ -n "$APP_UPDATE_PUBLIC_BASE_URL" ]; then
            case "$APP_UPDATE_PUBLIC_BASE_URL" in
              https://*) ;;
              *) echo "APP_UPDATE_PUBLIC_BASE_URL must be empty or an HTTPS URL"; exit 1 ;;
            esac
          fi

      - uses: actions/setup-java@v4
        if: steps.release_scope.outputs.release_android == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        if: steps.release_scope.outputs.release_android == 'true'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.release_scope.outputs.release_android == 'true'

      - name: Validate Android release configuration
        if: steps.release_scope.outputs.release_android == 'true'
        shell: bash
        run: |
          set -eu
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Restore signing keystore
        if: steps.release_scope.outputs.release_android == 'true'
        shell: bash
        run: |
          set -eu
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/release.keystore"

      - name: Build signed release APK
        if: steps.release_scope.outputs.release_android == 'true'
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
        run: |
          set -eu
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          BUILD_TOOLS_VERSION="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare atomic APK upload
        if: steps.release_scope.outputs.release_android == 'true'
        shell: bash
        run: |
          set -eu
          mkdir -p release-upload
          cp android/app/build/outputs/apk/release/app-release.apk "release-upload/$APK_FILE.part"
          sha256sum "release-upload/$APK_FILE.part"

      - uses: actions/upload-artifact@v4
        if: steps.release_scope.outputs.release_android == 'true'
        with:
          name: third-hand-${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            mkdir -p /opt/third-hand/releases
            test -w /opt/third-hand
            test -w /opt/third-hand/releases

      - name: Upload API deployment
        if: steps.release_scope.outputs.backend_changed == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: backend,docker-compose.yml,.env.example
          target: /opt/third-hand
          overwrite: true

      - name: Upload signed APK
        if: steps.release_scope.outputs.release_android == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: release-upload
          target: /opt/third-hand
          overwrite: true

      - name: Activate deployment and restart API
        uses: appleboy/ssh-action@v1.2.2
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APP_PUBLIC_BASE_URL: ${{ env.APP_PUBLIC_BASE_URL }}
          APP_UPDATE_PUBLIC_BASE_URL: ${{ env.APP_UPDATE_PUBLIC_BASE_URL }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          APK_FILE: ${{ env.APK_FILE }}
          BACKEND_CHANGED: ${{ steps.release_scope.outputs.backend_changed }}
          RELEASE_ANDROID: ${{ steps.release_scope.outputs.release_android }}
          DEPLOY_SHA: ${{ steps.release_scope.outputs.deploy_sha }}
          CHANGELOG: 自动发布 ${{ steps.release_scope.outputs.deploy_sha }}，包含最新行情、信息流和稳定性改进。
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: TUSHARE_TOKEN,DEEPSEEK_API_KEY,APP_PUBLIC_BASE_URL,APP_UPDATE_PUBLIC_BASE_URL,VERSION_CODE,VERSION_NAME,APK_FILE,BACKEND_CHANGED,RELEASE_ANDROID,DEPLOY_SHA,CHANGELOG
          script: |
            set -eu
            cd /opt/third-hand
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            update_env() {
              key="$1"
              value="$2"
              sed -i "/^${key}=/d" .env
              printf '%s=%s\n' "$key" "$value" >> .env
            }

            umask 077
            update_env THIRD_HAND_MARKET_PROVIDER auto
            update_env TUSHARE_TOKEN "$TUSHARE_TOKEN"
            update_env DEEPSEEK_API_KEY "$DEEPSEEK_API_KEY"
            update_env APP_PUBLIC_BASE_URL "$APP_PUBLIC_BASE_URL"
            update_env APP_UPDATE_PUBLIC_BASE_URL "$APP_UPDATE_PUBLIC_BASE_URL"
            update_env MARKET_REFRESH_ENABLED true
            update_env MARKET_REFRESH_INTERVAL_SECONDS 60

            if [ "$RELEASE_ANDROID" = "true" ]; then
              test -s "release-upload/$APK_FILE.part"
              mv -f "release-upload/$APK_FILE.part" "releases/$APK_FILE"
              update_env APP_UPDATE_APK_FILE "$APK_FILE"
              update_env APP_UPDATE_VERSION_CODE "$VERSION_CODE"
              update_env APP_UPDATE_VERSION_NAME "$VERSION_NAME"
              update_env APP_UPDATE_CHANGELOG "$CHANGELOG"
            else
              echo "No Android changes detected; preserving the currently published APK metadata."
            fi

            if docker compose version >/dev/null 2>&1; then
              if [ "$BACKEND_CHANGED" = "true" ]; then
                docker compose up -d --build --remove-orphans
              else
                docker compose up -d --no-deps --force-recreate api
              fi
              docker compose ps
            elif command -v docker-compose >/dev/null 2>&1; then
              if [ "$BACKEND_CHANGED" = "true" ]; then
                docker-compose up -d --build --remove-orphans
              else
                docker-compose up -d --no-deps --force-recreate api
              fi
              docker-compose ps
            else
              echo "Docker Compose is not installed on the server."
              exit 1
            fi

            sleep 5
            curl -fsS "http://127.0.0.1:${API_PORT:-8000}/health"
            curl -fsS "http://127.0.0.1:${API_PORT:-8000}/v1/app-update"

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "- Commit: \`${{ steps.release_scope.outputs.deploy_sha }}\`"
            echo "- Backend rebuilt: \`${{ steps.release_scope.outputs.backend_changed }}\`"
            echo "- Android APK published: \`${{ steps.release_scope.outputs.release_android }}\`"
            echo "- Version: \`${{ env.VERSION_NAME }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
