name: Verify Organization SSH Secrets

on:
  pull_request:
    paths:
      - '.github/workflows/verify-org-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate organization secrets are available
        shell: bash
        env:
          COMMON_SERVER_HOST: ${{ secrets.COMMON_SERVER_HOST }}
          COMMON_SERVER_USER: ${{ secrets.COMMON_SERVER_USER }}
          COMMON_SSH_PRIVATE_KEY: ${{ secrets.COMMON_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$COMMON_SERVER_HOST"
          test -n "$COMMON_SERVER_USER"
          test -n "$COMMON_SSH_PRIVATE_KEY"
          echo "Organization SSH secrets are present."

      - name: Verify SSH connectivity
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.COMMON_SERVER_HOST }}
          username: ${{ secrets.COMMON_SERVER_USER }}
          key: ${{ secrets.COMMON_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            echo "connected-user=$(whoami)"
            test -d /opt/third-hand
            test -w /opt/third-hand
            echo "third-hand-directory=ready"
