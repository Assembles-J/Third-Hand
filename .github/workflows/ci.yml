name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.env.example'
            android:
              - 'android/**'

  documentation-governance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Save PR body
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
      - name: Verify documentation synchronization
        shell: bash
        env:
          GOV_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GOV_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GOV_PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: python .github/scripts/check_documentation_sync.py

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -m pytest -q
      - run: docker build -t third-hand-api .

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Render Compose screenshot states
        run: ./gradlew --no-daemon :app:updateDebugScreenshotTest
      - name: Verify approved screenshot hashes
        shell: bash
        run: |
          set -eu
          cd app/src/screenshotTestDebug/reference
          sha256sum -c ../../screenshotTest/reference-sha256.txt
      - name: Upload rendered screenshot states
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshot-states
          path: android/app/src/screenshotTestDebug/reference
          if-no-files-found: error
      # Keep debug and release Kotlin compilation in separate JVM lifetimes so
      # the hosted runner does not OOM when both Compose variants overlap.
      - run: ./gradlew --no-daemon :app:assembleDebug
      - run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify optimized release APK
        shell: bash
        run: |
          set -eu
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          test -s app/build/outputs/mapping/release/mapping.txt
          foreign_abis="$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && $2 != "arm64-v8a" { print $2 }' | sort -u)"
          test -z "$foreign_abis" || { echo "Unexpected release ABIs: $foreign_abis"; exit 1; }

  ci-gate:
    needs: [changes, documentation-governance, backend, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        shell: bash
        run: |
          set -eu
          for result in \
            '${{ needs.documentation-governance.result }}' \
            '${{ needs.backend.result }}' \
            '${{ needs.android.result }}'; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
